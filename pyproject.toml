[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent_sleuth"
version = "0.1.0"
description = "Prevents untrusted data from triggering consequential actions in your agent."
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
authors = [
    { name = "Arnav Tripathy" },
    { name = "Noah Wong" },
]
keywords = ["llm", "agent", "security", "ifc", "prompt-injection", "taint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Core has ZERO agent-framework dependencies. PyYAML is optional (config.py degrades without it).
dependencies = []

[project.optional-dependencies]
config = ["pyyaml>=6.0"]
langchain = ["langchain-core>=0.1"]
agentdojo = ["agentdojo"]
dev = ["pytest>=7.0", "ruff>=0.1", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/Behuve-Labs/agent-sleuth"
Source   = "https://github.com/Behuve-Labs/agent-sleuth"
Issues   = "https://github.com/Behuve-Labs/agent-sleuth/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_sleuth"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
# The system anyio pytest plugin clashes with this Python; it isn't needed here.
addopts = "-p no:anyio"
testpaths = ["tests"]
